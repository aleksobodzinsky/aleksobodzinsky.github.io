<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aleksobodzinsky</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2.5rem 3rem;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .avatar {
            font-size: 3rem;
            margin-bottom: 0.25rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
        }

        .handle {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 1.8rem;
        }

        .handle a {
            color: #58a6ff;
            text-decoration: none;
        }

        .handle a:hover {
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid #30363d;
            margin: 1.5rem 0;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .project {
            display: block;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            text-decoration: none;
            color: #58a6ff;
            font-size: 1.1rem;
            font-weight: 500;
            transition: 0.15s ease;
        }

        .project:hover {
            background: #1c2128;
            color: #79c0ff;
        }

        .footer {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: #484f58;
            text-align: center;
        }

        .footer a {
            color: #484f58;
            text-decoration: none;
        }

        .footer a:hover {
            color: #8b949e;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="avatar">⚡</div>
        <h1>Aleksej Obodzinsky</h1>
        <div class="handle">
            <a href="https://github.com/aleksobodzinsky" target="_blank">github.com/aleksobodzinsky</a>
        </div>

        <hr class="divider" />

        <div class="project-list">
            <a href="https://github.com/aleksobodzinsky/SmallCraft" target="_blank" class="project">⛏️ SmallCraft</a>
            <a href="https://github.com/aleksobodzinsky/Durrlang" target="_blank" class="project">🧠 Durrlang</a>
            <a href="https://github.com/aleksobodzinsky/Durrbrowser" target="_blank" class="project">🌐 Durrbrowser</a>
        </div>

        <hr class="divider" />

        <div class="footer">
            <a href="https://github.com/aleksobodzinsky" target="_blank">github.com/aleksobodzinsky</a>
        </div>

    </div>

</body>
</html>
